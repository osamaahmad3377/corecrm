# Local development database. Not used in production (Vercel uses a managed
# PostgreSQL provider such as Neon or Supabase).
services:
  postgres:
    image: postgres:16-alpine
    container_name: corecrm-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: corecrm
      POSTGRES_PASSWORD: corecrm
      POSTGRES_DB: corecrm
    ports:
      - "5433:5432"
    volumes:
      - corecrm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corecrm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corecrm_pgdata:
